[project]
name = "floorball-analysis"
version = "0.1.0"
description = "Phase 1 feasibility test: place players from fixed full-court footage onto a 2D rink"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "opencv-python>=4.10",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/floorball_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
